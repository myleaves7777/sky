<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>우리반 밤하늘 관측</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 밤 관측장의 조용한 안내자 — 짧고 친절한 말
   IDEA: 별지기의 붉은 손전등과 성도(星圖) — 어둠에 적응한 눈을 지키는 붉은 빛
   PICTURE: 화면 전체가 실제 밤하늘(캔버스), 조작은 가장자리에 얇게
   COLOUR and TYPE: 깊은 밤 #060a16, 별빛 #efe9da, 붉은 손전등 #ff6a5c, 별자리선 #6f95d6 / IBM Plex Sans KR
   LAYOUT: 하늘이 화면을 꽉 채우고, 위엔 시각, 아래엔 시간 조작과 탭, 패널은 휴대폰에선 아래, 큰 화면에선 오른쪽 */
:root{color-scheme:dark;--bg:#060a16;--ink:#efe9da;--dim:#a7a291;--red:#ff6a5c;--line:#6f95d6;--glass:rgba(10,15,30,.82);--edge:rgba(239,233,218,.14)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;overflow:hidden}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
button,select,input{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--edge);border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:active{background:rgba(255,106,92,.18)}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--edge)}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
#clock{pointer-events:auto;border-radius:14px;padding:8px 14px;text-align:left;min-height:auto}
#clock b{display:block;font-size:clamp(17px,2.2vw,26px);line-height:1.2;font-weight:700;white-space:nowrap}
#clock small{color:var(--dim);font-size:13px}
#clock .live{color:var(--red)}
#phase{pointer-events:auto;border-radius:14px;padding:6px 10px;display:flex;gap:8px;align-items:center;min-height:auto}
#phase canvas{width:38px;height:38px}
#phase span{font-size:13px;line-height:1.3;text-align:left;white-space:nowrap}
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 70px);width:min(560px,calc(100% - 24px));border-radius:14px;padding:10px 14px;display:none;gap:10px;align-items:center;border-color:rgba(255,106,92,.5)}
#banner.on{display:flex}
#banner p{margin:0;flex:1;font-size:15px}
#banner p b{color:var(--red);font-weight:700}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.bar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;border-radius:16px;padding:6px}
.bar button{border-color:transparent;font-size:14px;padding:0 10px}
#play svg{width:20px;height:20px;fill:var(--ink)}
#speed{color:var(--red);font-weight:600;min-width:82px}
.tabs button{min-width:74px;font-weight:600}
.tabs button.on{background:var(--red);color:#1a0705}
#info{position:fixed;left:12px;bottom:calc(140px + env(safe-area-inset-bottom));width:min(340px,calc(100% - 24px));border-radius:16px;padding:14px 16px;display:none}
#info.on{display:block}
#info h3{margin:0;font-size:20px;line-height:1.25}
#info .k{color:var(--dim);font-size:13px;margin:2px 0 8px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px;font-size:14px}
#info dt{color:var(--dim)}#info dd{margin:0;font-variant-numeric:tabular-nums}
#info p{margin:0 0 10px;font-size:14px}
#info .row{display:flex;gap:8px}
#info .x{position:absolute;top:6px;right:6px;border:0}
#info canvas{float:right;width:56px;height:56px;margin:0 0 4px 8px}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:72vh;border-radius:20px 20px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto;display:none;z-index:5}
#panel.on{display:block}
@media(max-width:899px){#panel{bottom:var(--bb,140px);max-height:calc(100vh - var(--bb,140px) - 80px);border-radius:20px;margin:0 8px;padding-bottom:16px}body.pn #info{display:none}}
@media(min-width:900px){#panel{left:auto;top:0;width:380px;max-height:none;border-radius:0}#info{bottom:150px}}
#panel h2{font-size:22px;margin:0 0 4px;line-height:1.2}
#panel .sub{color:var(--dim);font-size:14px;margin:0 0 14px}
#panel .close{position:absolute;top:10px;right:10px}
.grp{margin:0 0 18px}
.grp h4{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:14px}
.chips button.on{border-color:var(--red);color:var(--red)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim);margin:0 0 10px}
select,input{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:10px;min-height:44px;padding:0 10px;font-size:16px}
select option{background:#101626}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mis{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin:0 0 8px;border-radius:14px;min-height:auto}
.mis .n{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center;font-size:14px;font-weight:700}
.mis.done .n{background:var(--red);border-color:var(--red);color:#1a0705}
.mis.act{border-color:var(--red)}
.mis b{display:block;font-size:16px}
.mis span{display:block;color:var(--dim);font-size:13px;line-height:1.4}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin:6px 0 16px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:4px;transition:width .4s}
#dlg{position:fixed;inset:0;background:rgba(3,5,12,.6);display:none;place-items:center;z-index:9;padding:16px}
#dlg.on{display:grid}
#dlg .card{width:min(460px,100%);border-radius:20px;padding:20px}
#dlg h3{margin:0 0 6px;font-size:22px;color:var(--red)}
#dlg p{margin:0 0 12px}
#dlg .opts{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
#dlg .opts button{text-align:left;padding:10px 14px}
#dlg .opts button.ok{border-color:#7fd6a0;color:#7fd6a0}
#dlg .opts button.no{border-color:var(--red);color:var(--red)}
#dlg .exp{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;font-size:15px;display:none}
.note{color:var(--dim);font-size:13px}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);border-radius:12px;padding:10px 16px;display:none;z-index:8;text-align:center}
#toast.on{display:block}
@media(max-width:480px){.bar{flex-wrap:nowrap;gap:2px}.bar button{padding:0 6px;font-size:13px;min-width:40px}.tabs button{min-width:66px}#speed{min-width:58px}}
@media(max-width:400px){.tabs button{min-width:0;padding:0 7px}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

<canvas id="sky" aria-label="밤하늘 화면. 끌어서 둘러보고, 별을 눌러 정보를 봐요."></canvas>

<div id="top">
  <button id="clock" class="glass" aria-label="시간과 장소 바꾸기"><b id="tm">–</b><small id="pl">서울</small></button>
  <button id="phase" class="glass" aria-label="오늘 달의 모양"><canvas id="phc" width="76" height="76"></canvas><span id="pht">–</span></button>
</div>

<div id="banner" class="glass" role="status"><p id="bnt"></p><button id="bnh">힌트</button></div>

<div id="info" class="glass" aria-live="polite"><button class="x" id="infx" aria-label="닫기">✕</button><div id="infb"></div></div>

<div id="bottom">
  <div class="bar glass" aria-label="시간 조작">
    <button data-step="-86400">−1일</button>
    <button data-step="-3600">−1시간</button>
    <button id="play" aria-label="재생"><svg viewBox="0 0 24 24" id="pli"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button id="speed" aria-label="재생 빠르기">10분/초</button>
    <button data-step="3600">+1시간</button>
    <button data-step="86400">+1일</button>
    <button id="now">지금</button>

    <button data-p="mission">미션</button>
    <button data-p="find">찾기</button>
    <button data-p="time">시간·장소</button>

<div id="toast" class="glass"></div>

// ---- 천문 계산 (근사식: 별·행성 수 분각, 달 약 0.3° 이내) ----
const D = Math.PI / 180;
const norm = x => ((x % 360) + 360) % 360;
const toJD = ms => ms / 86400000 + 2440587.5;
function parseRA(s) { const [h, m, sec] = s.split(' ').map(Number); return (h + m / 60 + (sec || 0) / 3600) * 15; }
function parseDec(s) { s = s.trim(); const sg = s[0] === '-' ? -1 : 1; const [d, m] = s.replace(/^[+-]/, '').split(' ').map(Number); return sg * (d + m / 60); }
function precess(ra, dec, T) {
  const z1 = (0.6406161 * T + 0.0000839 * T * T) * D, z2 = (0.6406161 * T + 0.0003041 * T * T) * D, th = (0.5567530 * T - 0.0001185 * T * T) * D;
  const a = ra * D, d = dec * D;
  const A = Math.cos(d) * Math.sin(a + z1);
  const B = Math.cos(th) * Math.cos(d) * Math.cos(a + z1) - Math.sin(th) * Math.sin(d);
  const C = Math.sin(th) * Math.cos(d) * Math.cos(a + z1) + Math.cos(th) * Math.sin(d);
  return [norm((Math.atan2(A, B) + z2) / D), Math.asin(Math.max(-1, Math.min(1, C))) / D];
}
// JPL 근사 궤도요소 (a, e, I, L, 근일점경도, 승교점경도) 와 세기당 변화
const EL = {
  mercury: [0.38709927, 0.00000037, 0.20563593, 0.00001906, 7.00497902, -0.00594749, 252.25032350, 149472.67411175, 77.45779628, 0.16047689, 48.33076593, -0.12534081],
  venus: [0.72333566, 0.00000390, 0.00677672, -0.00004107, 3.39467605, -0.00078890, 181.97909950, 58517.81538729, 131.60246718, 0.00268329, 76.67984255, -0.27769418],
  earth: [1.00000261, 0.00000562, 0.01671123, -0.00004392, -0.00001531, -0.01294668, 100.46457166, 35999.37244981, 102.93768193, 0.32327364, 0, 0],
  mars: [1.52371034, 0.00001847, 0.09339410, 0.00007882, 1.84969142, -0.00813131, -4.55343205, 19140.30268499, -23.94362959, 0.44441088, 49.55953891, -0.29257343],
  jupiter: [5.20288700, -0.00011607, 0.04838624, -0.00013253, 1.30439695, -0.00183714, 34.39644051, 3034.74612775, 14.72847983, 0.21252668, 100.47390909, 0.20469106],
  saturn: [9.53667594, -0.00125060, 0.05386179, -0.00050991, 2.48599187, 0.00193609, 49.95424423, 1222.49362201, 92.59887831, -0.41897216, 113.66242448, -0.28867794]
};
function helio(p, T) {
  const e = EL[p];
  const a = e[0] + e[1] * T, ec = e[2] + e[3] * T, I = (e[4] + e[5] * T) * D, L = e[6] + e[7] * T, w = e[8] + e[9] * T, O = e[10] + e[11] * T;
  const om = (w - O) * D, Om = O * D, M = norm(L - w) * D;
  let E = M + ec * Math.sin(M);
  for (let i = 0; i < 8; i++) E -= (E - ec * Math.sin(E) - M) / (1 - ec * Math.cos(E));
  const xp = a * (Math.cos(E) - ec), yp = a * Math.sqrt(1 - ec * ec) * Math.sin(E);
  const co = Math.cos(om), so = Math.sin(om), cO = Math.cos(Om), sO = Math.sin(Om), cI = Math.cos(I), sI = Math.sin(I);
  return [(co * cO - so * sO * cI) * xp + (-so * cO - co * sO * cI) * yp,
          (co * sO + so * cO * cI) * xp + (-so * sO + co * cO * cI) * yp,
          (so * sI) * xp + (co * sI) * yp];
}
function eclEq(x, y, z, ep) {
  const ye = y * Math.cos(ep) - z * Math.sin(ep), ze = y * Math.sin(ep) + z * Math.cos(ep), r = Math.hypot(x, ye, ze);
  return [norm(Math.atan2(ye, x) / D), Math.asin(ze / r) / D, r];
}
function ephem(ms) {
  const JD = toJD(ms), d = JD - 2451545, T = d / 36525;
  const eps0 = 23.4392911 * D, eps = (23.4392911 - 0.0130042 * T) * D;
  const E = helio('earth', T), B = {};
  let [ra, dec, r] = eclEq(-E[0], -E[1], -E[2], eps0);
  [ra, dec] = precess(ra, dec, T);
  B.sun = { ra, dec, dist: r };
  const sunLon = norm(Math.atan2(-E[1], -E[0]) / D + 1.3969713 * T);
  for (const p of ['mercury', 'venus', 'mars', 'jupiter', 'saturn']) {
    const P = helio(p, T);
    let [a, b, rr] = eclEq(P[0] - E[0], P[1] - E[1], P[2] - E[2], eps0);
    [a, b] = precess(a, b, T);
    B[p] = { ra: a, dec: b, dist: rr };
  }
  const Lp = 218.316 + 13.176396 * d, Mp = (134.963 + 13.064993 * d) * D, F = (93.272 + 13.229350 * d) * D,
        Dm = (297.850 + 12.190749 * d) * D, Ms = (357.529 + 0.98560028 * d) * D;
  const lam = Lp + 6.289 * Math.sin(Mp) + 1.274 * Math.sin(2 * Dm - Mp) + 0.658 * Math.sin(2 * Dm) + 0.214 * Math.sin(2 * Mp) - 0.186 * Math.sin(Ms) - 0.114 * Math.sin(2 * F);
  const bet = 5.128 * Math.sin(F) + 0.280 * Math.sin(Mp + F) + 0.278 * Math.sin(Mp - F) + 0.173 * Math.sin(2 * Dm - F);
  const l = lam * D, b = bet * D;
  const [mra, mdec] = eclEq(Math.cos(b) * Math.cos(l), Math.cos(b) * Math.sin(l), Math.sin(b), eps);
  const s = B.sun;
  const cosE = Math.sin(s.dec * D) * Math.sin(mdec * D) + Math.cos(s.dec * D) * Math.cos(mdec * D) * Math.cos((s.ra - mra) * D);
  B.moon = { ra: mra, dec: mdec, dist: 385001 - 20905 * Math.cos(Mp), age: norm(lam - sunLon) / 360 * 29.530589, illum: (1 - cosE) / 2 };
  const gmst = norm(280.46061837 + 360.98564736629 * d + 0.000387933 * T * T);
  return { JD, T, gmst, B };
}
function horiz(ra, dec, lst, lat) {
  const H = (lst - ra) * D, d = dec * D, f = lat * D;
  const sa = Math.sin(f) * Math.sin(d) + Math.cos(f) * Math.cos(d) * Math.cos(H);
  const alt = Math.asin(Math.max(-1, Math.min(1, sa))) / D;
  const az = norm(Math.atan2(-Math.sin(H) * Math.cos(d), Math.cos(f) * Math.sin(d) - Math.sin(f) * Math.cos(d) * Math.cos(H)) / D);
  return [alt, az];
}
function refract(h) { return h > -1.5 ? h + 1.02 / Math.tan((h + 10.3 / (h + 5.11)) * D) / 60 : h; }

</script>

    S.lat = +p.coords.latitude.toFixed(3); S.lon = +p.coords.longitude.toFixed(3); S.place = '내 위치(GPS)'; rsCache = null; dirty = true;

    toast(`현재 위치로 맞췄어요<br>위도 ${S.lat}° · 경도 ${S.lon}°`); if (panel === 'time') renderPanel();
  }, err => {
    btn.textContent = '내 위치 사용 (GPS)'; btn.disabled = false;
    toast(err.code === 1 ? '위치 권한이 거부됐어요.<br>브라우저 설정에서 허용하거나 도시를 골라 주세요.' : '위치를 찾지 못했어요.<br>도시를 골라 주세요.');
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
}

// ---------- 하늘에 대기 (방향 센서) ----------
let sens = null, evName = '';
S.sensor = false; S.azOff = -8.5; // 한국의 자기 편각(약 8.5° 서편) 보정
function rotM(a, b, g) {
  a *= D; b *= D; g *= D; const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
  return [[ca * cg - sa * sb * sg, -sa * cb, ca * sg + sa * sb * cg], [sa * cg + ca * sb * sg, ca * cb, sa * sg - ca * sb * cg], [-cb * sg, sb, cb * cg]];
}
const nrm = v => { const l = Math.hypot(...v) || 1; return v.map(x => x / l); };
const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function onOri(e) {
  if (!sens || e.alpha == null || e.beta == null) return;
  let a = e.alpha;
  if (e.webkitCompassHeading != null) { // iPhone: 나침반 값으로 북쪽 맞추기
    const R0 = rotM(a, e.beta, e.gamma), v = Math.abs(e.beta) > 45 ? [-R0[0][2], -R0[1][2]] : [R0[0][1], R0[1][1]];
    const off = norm(e.webkitCompassHeading - Math.atan2(v[0], v[1]) / D + 180) - 180;
    sens.ios = sens.ios == null ? off : sens.ios + (norm(off - sens.ios + 180) - 180) * 0.1;
    a -= sens.ios; sens.abs = true;
  } else sens.abs = !!e.absolute || e.type === 'deviceorientationabsolute';
  a -= S.azOff;
  const M = rotM(a, e.beta, e.gamma), th = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * D;
  const r0 = [M[0][0], M[1][0], M[2][0]], u0 = [M[0][1], M[1][1], M[2][1]], f = [-M[0][2], -M[1][2], -M[2][2]];
  const u = u0.map((x, i) => Math.sin(th) * r0[i] + Math.cos(th) * x);
  const k = sens.f ? 0.3 : 1;
  sens.f = nrm(sens.f ? sens.f.map((x, i) => x + (f[i] - x) * k) : f);
  const uu = nrm(sens.u ? sens.u.map((x, i) => x + (u[i] - x) * k) : u);
  sens.r = nrm(crs(sens.f, uu)); sens.u = crs(sens.r, sens.f);
  if (!sens.got) { sens.got = true; if (!sens.abs) toast('이 기기는 북쪽을 정확히 몰라요.<br>북극성이나 달을 보고 화면을 좌우로 끌어 맞춰 주세요.'); }
  dirty = true;
}
async function toggleSensor() {
  if (S.sensor) { stopSensor(); return; }
  try { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') { toast('방향 센서 사용이 허용되지 않았어요.'); return; } } }
  catch (err) { toast('방향 센서를 켤 수 없어요.'); return; }
  sens = { got: false }; evName = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
  addEventListener(evName, onOri); S.sensor = true; anim = null; $('sens').classList.add('on'); $('sens').textContent = '센서 끄기';
  toast('휴대폰 뒷면을 하늘로 향해 보세요.<br>방향이 어긋나면 화면을 좌우로 끌어 맞춰요.');
  setTimeout(() => { if (S.sensor && sens && !sens.got) { stopSensor(); toast('이 기기에서는 방향 센서를 쓸 수 없어요.<br>화면을 끌어서 둘러보세요.'); } }, 2500);
}
function stopSensor() { removeEventListener(evName, onOri); S.sensor = false; sens = null; $('sens').classList.remove('on'); $('sens').textContent = '하늘에 대기'; S.alt = Math.max(-30, Math.min(90, S.alt)); infoKey = ''; dirty = true; }
$('sens').onclick = toggleSensor;

// ---------- 루프 ----------
let last = performance.now(), lastCheck = 0;
function loop(now) {
  const dt = now - last; last = now;
  if (anim) anim(now);
  if (S.live) { if (Math.floor(Date.now() / 60e3) !== Math.floor(S.t / 60e3)) dirty = true; S.t = Date.now(); }
  else if (S.playing) { S.t += dt * SPEEDS[S.spd][0]; dirty = true; }
  if (dirty) { dirty = false; try { draw(); } catch (err) { console.error(err); } }
  if (now - lastCheck > 300) { lastCheck = now; missionCheck(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts) document.fonts.ready.then(() => dirty = true);
})();
</script>
